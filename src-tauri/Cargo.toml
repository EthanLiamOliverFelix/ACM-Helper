[package]
name = "my-acm-helper"
version = "0.1.0"
description = "A local-first ACM problem-solving desktop workspace"
authors = ["EthanLiamOliverFelix"]
license = "MIT"
repository = "https://github.com/EthanLiamOliverFelix/ACM-Helper"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_acm_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "native-tls", "charset"] }
scraper = "0.20"
regex = "1"
urlencoding = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["sync", "process", "time", "io-util", "macros"] }
arboard = "3"
rfd = "0.15"
base64 = "0.22"
pdf-extract = "0.7"
